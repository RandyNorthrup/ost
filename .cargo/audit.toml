# cargo audit settings (CI's "Dependency audit" job runs `cargo audit` on
# every push and pull request; it fails on any vulnerability). Keep the
# ignore list the same as deny.toml's [advisories] ignore, which has the
# full reasons; each entry is reviewed again by its date.
#
# The three advisories ignored here are "unmaintained" notices, not
# vulnerabilities: zbus 6 merged zbus_names, zvariant and zvariant_derive
# into zbus itself, so their standalone crates won't get releases. They come
# in with zbus 5, which ksni (tray icon) and keyring's Secret Service store
# (sign-in tokens) still require, and which OST's own D-Bus calls share with
# them. Review by 2027-02-25.
[advisories]
ignore = [
    "RUSTSEC-2026-0370", # zvariant: merged into zbus 6 (its wire module)
    "RUSTSEC-2026-0371", # zbus_names: merged into zbus 6 (its names module)
    "RUSTSEC-2026-0372", # zvariant_derive: its derives ship with zbus 6
]

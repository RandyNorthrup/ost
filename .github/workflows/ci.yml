# Audits the dependencies, and builds and tests, every push to main and every
# pull request; the builds run on Ubuntu 26.04
# with its own Qt, Rust and libraries: the same container and build
# dependencies as the release packages (desktop/packaging/build-deb.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: CI only builds and tests, and it keeps target/ (and the
  # cache) a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  QMAKE: /usr/lib/qt6/bin/qmake6

jobs:
  # A push to a PR that only touches the backlog, docs or Markdown (an agent
  # recording a task's status after its code passed) skips the jobs below,
  # but only when every job it would skip
  # completed successfully on the previous head: the code is what already passed. GitHub counts skipped
  # required checks as passing; the coordinator's merge gate also requires the
  # PR's last code commit to have passed. Pushes to main, new PRs and
  # force-pushes (rebases) always run everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$ACTION" = synchronize ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER" \
             && ! git diff --name-only "$BEFORE" "$AFTER" | grep -qvE '^(backlog|docs)/|\.md$'; then
            # Only skip when the previous head's required checks finished and succeeded (a run
            # still going, failed or cancelled by this push's concurrency group runs everything).
            ok=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?per_page=100" \
                   --jq '[.check_runs[]|select(.name as $n|["Dependency audit","Format","JavaScript tests","Clippy","Build and test","Release build refuses test-harness flags"]|index($n))
                          |select(.status=="completed" and .conclusion=="success")|.name]|unique|length')
            if [ "$ok" = 6 ]; then code=false; else echo "previous head ${BEFORE:0:8} hasn't passed every job this would skip ($ok/6), running everything"; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  audit:
    # Every crate in Cargo.lock against the RustSec advisory database
    # (vulnerabilities, unmaintained, unsound and yanked crates), its license
    # and its source. The exceptions, each with its reason and review date,
    # are in deny.toml and .cargo/audit.toml.
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Both pinned to an exact release and checked against its SHA-256.
      CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-x86_64-unknown-linux-musl.tar.gz
      CARGO_DENY_SHA256: 13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d
      CARGO_AUDIT_URL: https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz
      CARGO_AUDIT_SHA256: 4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny and cargo-audit
        run: |
          d=$RUNNER_TEMP/audit-tools
          mkdir -p "$d/bin"
          curl -fsSL --retry 3 -o "$d/deny.tar.gz" "$CARGO_DENY_URL"
          curl -fsSL --retry 3 -o "$d/audit.tar.gz" "$CARGO_AUDIT_URL"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$d/deny.tar.gz" "$CARGO_AUDIT_SHA256" "$d/audit.tar.gz" | sha256sum -c -
          tar -xzf "$d/deny.tar.gz" -C "$d/bin" --strip-components=1 --wildcards '*/cargo-deny'
          tar -xzf "$d/audit.tar.gz" -C "$d/bin" --strip-components=1 --wildcards '*/cargo-audit'
          echo "$d/bin" >> "$GITHUB_PATH"
      - name: cargo deny (advisories, licenses, sources, bans)
        run: cargo deny --locked check advisories licenses sources bans
      - name: cargo audit (fails on any vulnerability)
        run: cargo audit

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo and rustfmt
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends cargo rustfmt
      - run: cargo fmt --all --check

  # The desktop app's own scripts that run in its web pages (desktop/src/*.js),
  # under Node's built-in test runner with no packages: the TeamsJS host's
  # origin checks (desktop/tests/app_host.test.mjs).
  js-test:
    name: JavaScript tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test desktop/tests/*.test.mjs

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sh desktop/packaging/build-deb.sh --deps-only
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends rust-clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The desktop test harness (a dev/CI-only feature) is linted too.
      - run: cargo clippy --locked -p ost-desktop --all-targets --features test-harness -- -D warnings

  build-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sh desktop/packaging/build-deb.sh --deps-only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ost-desktop (with the test harness, as development builds)
        run: cargo build --locked -p ost-desktop --features test-harness
      - name: Build teams-cli
        run: cargo build --locked --bin teams-cli --features audio
      - name: Engine tests
        run: cargo test --locked --features audio,video --lib
      - name: Desktop tests
        run: cargo test --locked -p ost-desktop

  # Release packages build without the test-harness feature: such a build
  # must refuse the harness's launch flags (and the positional capture
  # paths) before anything starts, so no launch can drive the app or run
  # caller-supplied script.
  release-harness-off:
    name: Release build refuses test-harness flags
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sh desktop/packaging/build-deb.sh --deps-only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ost-desktop as the release packages do
        run: cargo build --locked --release -p ost-desktop
      - name: Harness flags are refused
        run: |
          bin=target/release/ost-desktop
          "$bin" --version
          for args in "--nav-test" "--cal-test --cal-page-steps=cv.x()" "--loop-test --loop-steps=/tmp/x" "/tmp/shot.png" "--room --shots=/tmp"; do
            set +e
            # shellcheck disable=SC2086
            out=$(QT_QPA_PLATFORM=offscreen timeout 20 "$bin" $args 2>&1)
            status=$?
            set -e
            echo "ost-desktop $args -> $status: $out"
            [ "$status" = 2 ] || { echo "::error::a release build accepted: $args"; exit 1; }
            echo "$out" | grep -q "unrecognized option" || { echo "::error::no refusal message for: $args"; exit 1; }
          done

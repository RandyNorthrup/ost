# Builds and tests every push to main and every pull request on Ubuntu 26.04
# with its own Qt, Rust and libraries: the same container and build
# dependencies as the release packages (desktop/packaging/build-deb.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: CI only builds and tests, and it keeps target/ (and the
  # cache) a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  QMAKE: /usr/lib/qt6/bin/qmake6

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo and rustfmt
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends cargo rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sh desktop/packaging/build-deb.sh --deps-only
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends rust-clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sh desktop/packaging/build-deb.sh --deps-only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ost-desktop
        run: cargo build --locked -p ost-desktop
      - name: Build teams-cli
        run: cargo build --locked --bin teams-cli --features audio
      - name: Engine tests
        run: cargo test --locked --features audio,video --lib
      - name: Desktop tests
        run: cargo test --locked -p ost-desktop

# Deletes workflow runs nobody needs any more, every hour: cancelled runs
# (CI cancels a PR's run when a new commit arrives), failed runs that a newer
# run has replaced, older runs of a check on the same branch, and runs from
# branches that are merged or closed.
# It never deletes a Release run, a run that is still going, or the newest run
# of each workflow on main and on each open pull request.
name: Prune workflow runs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: prune-runs
  cancel-in-progress: false

jobs:
  prune:
    name: Prune workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete unneeded runs
        run: |
          set -euo pipefail
          # every open PR, all pages: a PR missing here would have its runs treated as closed
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | [(.number|tostring), (.head.repo.full_name // ""), .head.ref] | @tsv' > open-prs.tsv
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, (.workflow_id|tostring), .head_branch // "", .status, .conclusion // "", .created_at, .path, (.head_repository.full_name // ""), .event, ([.pull_requests[]?.number|tostring]|join(","))] | @tsv' > runs.tsv
          python3 - <<'EOF'
          import csv, os, datetime
          cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=3)).strftime("%Y-%m-%dT%H:%M:%SZ")
          repo = os.environ["REPO"]
          prs = list(csv.reader(open("open-prs.tsv"), delimiter="\t", quoting=csv.QUOTE_NONE))
          open_nums = {n for n, _, _ in prs}
          open_heads = {(r, b) for _, r, b in prs}
          rows = sorted(csv.reader(open("runs.tsv"), delimiter="\t", quoting=csv.QUOTE_NONE), key=lambda r: r[5], reverse=True)
          def ctx(r):
              """What a run belongs to: one open PR, main of this repo, or something else.
              CodeQL's default setup names runs "PR #n" and reports the branch as refs/pull/n/head."""
              _, _, branch, _, _, _, _, head_repo, event, nums = r
              m = branch.startswith("refs/pull/") and branch.split("/")[2]
              if m:
                  return ("pr", m)
              if event in ("pull_request", "pull_request_target"):
                  return ("pr", nums.split(",")[0] if nums else f"{head_repo}:{branch}")
              return (event if event in ("push", "schedule", "workflow_dispatch", "dynamic") else "other", f"{head_repo}:{branch}")
          def live(c):
              kind, key = c
              if kind == "pr":
                  return key in open_nums or tuple(key.split(":", 1)) in open_heads
              return key == f"{repo}:main"
          newest = {}
          for r in rows:
              newest.setdefault((r[1], ctx(r)), r[0])   # grouped by workflow id and context
          out = []
          for r in rows:
              rid, wf, _, status, concl, _, path = r[:7]
              if status != "completed" or path.split("@", 1)[0].endswith("/release.yml"):
                  continue                         # never a Release run (path may carry @ref)
              if path.split("@", 1)[0].endswith("/agent-build.yml") and r[5] > cutoff:
                  continue                         # an agent build's binary may still be downloading
              c = ctx(r)
              if concl == "cancelled":
                  out.append(rid)
              elif newest[(wf, c)] != rid:
                  out.append(rid)                  # a newer run of this workflow exists for the same PR or branch
              elif not live(c):
                  out.append(rid)                  # its PR or branch is merged, closed or gone
          open("delete.txt", "w").write("\n".join(out) + ("\n" if out else ""))
          print(f"{len(rows)} runs, deleting {len(out)}")
          EOF
          deleted=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then deleted=$((deleted+1)); fi
          done < delete.txt
          echo "Deleted $deleted runs" | tee -a "$GITHUB_STEP_SUMMARY"

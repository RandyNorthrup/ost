# On-demand builds for agents working on OST: a coordinator script
# (ghbuild.sh) pushes a work-in-progress snapshot to a wip/ branch and
# dispatches this workflow, which builds it in the same Ubuntu 26.04
# container as CI and the release packages and uploads the binary for a day.
# The build machines that run OST for live checks are all Ubuntu 26.04, so
# the binary runs there as is. Only people with write access can dispatch
# it, and inputs are a fixed choice plus names checked against a pattern,
# never run as shell code.
name: Agent build

on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to build
        type: choice
        options: [harness, harness-tests, clippy, example]
        default: harness
      filter:
        description: "harness-tests: lib test filter; example: example name (letters, digits, _ : -)"
        required: false
        default: ""
      tag:
        description: Label for the run (letters, digits, - _ .)
        required: false
        default: ""

run-name: "Agent build: ${{ inputs.kind }} ${{ inputs.tag }} (${{ github.ref_name }})"

permissions:
  contents: read

concurrency:
  group: agent-build-${{ github.ref_name }}-${{ inputs.kind }}-${{ inputs.filter }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  QMAKE: /usr/lib/qt6/bin/qmake6

jobs:
  build:
    name: Agent build
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 120
    defaults:
      run:
        # bash -eo pipefail, so a failed cargo step fails even when piped through tee
        shell: bash
    env:
      KIND: ${{ inputs.kind }}
      FILTER: ${{ inputs.filter }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check inputs
        run: |
          case "$FILTER" in *[!A-Za-z0-9_:-]*) echo "filter may only hold letters, digits, _ : -"; exit 1;; esac
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "tag may only hold letters, digits, . _ -"; exit 1;; esac
          if [ "$KIND" = example ] && [ -z "$FILTER" ]; then echo "example needs its name in filter"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sh desktop/packaging/build-deb.sh --deps-only
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: agent-build
          save-if: "false"
      - name: Build
        run: |
          mkdir -p out
          case "$KIND" in
            harness)
              cargo build --locked -p ost-desktop --features test-harness
              cp target/debug/ost-desktop out/ ;;
            harness-tests)
              cargo build --locked -p ost-desktop --features test-harness
              cp target/debug/ost-desktop out/
              cargo test --locked --features audio,video --lib -- "$FILTER" 2>&1 | tee out/tests.log ;;
            clippy)
              cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee out/clippy.log
              cargo clippy --locked -p ost-desktop --all-targets --features test-harness -- -D warnings 2>&1 | tee -a out/clippy.log ;;
            example)
              cargo build --locked --example "$FILTER" --features test-harness 2>&1 | tail -n 40
              cp "target/debug/examples/$FILTER" out/ ;;
          esac
          git rev-parse HEAD > out/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-build
          path: out/
          retention-days: 1
          if-no-files-found: warn

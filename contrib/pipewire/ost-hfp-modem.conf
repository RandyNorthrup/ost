# Bluetooth (HFP) headset call buttons for OST: PipeWire's HFP audio gateway
# takes a headset's answer (ATA) and hang-up (AT+CHUP) to the calls of a
# ModemManager modem; OST offers its calls as one on the session bus.
# Needs PipeWire's bluez5 plugin with bluez5-native-modem-session-bus.patch.
# Install as ~/.config/wireplumber/wireplumber.conf.d/ost-hfp-modem.conf and
# restart WirePlumber.
monitor.bluez.properties = {
  bluez5.hfphsp-backend-native-modem = "any"
  bluez5.hfphsp-backend-native-modem-bus = "session"
}

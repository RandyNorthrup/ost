# OST as a Flatpak, for the .flatpak bundle attached to each release.
#
#   flatpak run --command=flathub-build org.flatpak.Builder \
#     desktop/packaging/flatpak/io.github.RandyNorthrup.ost.yml
#   flatpak build-bundle repo OST-<version>-x86_64.flatpak io.github.RandyNorthrup.ost
#
# It builds the checkout it sits in. cargo-sources.json lists the crates in
# Cargo.lock (flatpak-cargo-generator); regenerate it whenever Cargo.lock
# changes:
#   flatpak-cargo-generator.py Cargo.lock -o desktop/packaging/flatpak/cargo-sources.json
id: io.github.RandyNorthrup.ost
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: ost-desktop
# Each permission below is one OST uses, with what for; anything not listed
# (home folder, other files, other D-Bus names, the session's other apps)
# stays out of reach. Screen sharing, opening links and picking files to
# send go through the desktop portals, which need no permission here. The
# KDE runtime adds its own: read access to kdeglobals (theme, fonts) and the
# bus names KDE apps use to follow settings changes and the global menu
# (org.kde.KGlobalSettings, org.kde.kconfig.notify,
# com.canonical.AppMenu.Registrar).
finish-args:
  # Teams' service, its calls' media (TURN/UDP) and the Microsoft 365 web
  # apps it embeds.
  - --share=network
  # The window: Wayland, or X11 where there's no Wayland session (ipc: the
  # X server's shared memory, which X11 rendering needs).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The GPU only. Cameras come through the Camera portal
  # (org.freedesktop.portal.Camera, which needs no permission here): it asks
  # once, then hands over a PipeWire connection with only the cameras on it
  # (UVC webcams, libcamera cameras such as Intel IPU6, virtual cameras
  # that PipeWire offers). No /dev access otherwise: a V4L2 device PipeWire
  # doesn't offer (a v4l2loopback device fed after login) isn't seen, and
  # headsets' call buttons, lights and ring (HID: hidraw, hiddev and usbfs
  # nodes, src/calling/hid_telephony.rs) aren't available in the Flatpak,
  # as Flatpak has no permission narrower than --device=all for HID. They
  # work in the .deb, .rpm and AppImage.
  - --device=dri
  # Audio: microphones and speakers by PipeWire node, and the screen-share
  # streams the ScreenCast portal hands over (xdg-run/pipewire-0); ringtones,
  # notification sounds and video clips through Qt Multimedia's PulseAudio
  # output (PipeWire's pulse server). Flatpak also shows the sandbox the
  # sound card nodes (/dev/snd) with --socket=pulseaudio; OST doesn't open
  # them (cpal plays and records through PipeWire).
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # Downloaded files go to Downloads without a dialog, as in Teams. Only
  # that folder: nothing else of the home folder is visible.
  - --filesystem=xdg-download
  # Notifications (the desktop's notification server, as notify-rust talks
  # to it).
  - --talk-name=org.freedesktop.Notifications
  # The sign-in tokens are kept in the desktop keyring (Secret Service:
  # GNOME Keyring, KWallet, KeePassXC), never in a file.
  - --talk-name=org.freedesktop.secrets
  # The tray icon (StatusNotifierItem) and the launcher's unread badge.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.Unity
  # Keeping OST's own windows out of screen shares on KDE Plasma.
  - --talk-name=org.kde.KWin
  # Away when the screen locks (logind's LockedHint, read only); work
  # location from the Wi-Fi network's name (NetworkManager, read only);
  # nearby Teams Rooms from their Bluetooth beacons (BlueZ: an LE scan while
  # the pre-join screen's Room audio looks for rooms; nothing is paired or
  # changed).
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.bluez
  # Not a permission: where the spell-check dictionaries are.
  - --env=QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  # Teams-style notification banners on Wayland (wlr-layer-shell).
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    cleanup:
      - /include
      - /lib/cmake
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.8.3/layer-shell-qt-6.8.3.tar.xz
        sha256: af3e56be10eb95a5993600449d6c811a08d491f7905c40a1203040b5baf98f9e

  - name: ost
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      prepend-pkg-config-path: /app/lib/x86_64-linux-gnu/pkgconfig
      env:
        CARGO_HOME: /run/build/ost/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
        QMAKE: /usr/bin/qmake
        QTWEBENGINE_DISABLE_SANDBOX: '1'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked -p ost-desktop
      - cargo --offline build --release --locked --bin teams-cli --features audio
      - install -Dm755 target/release/ost-desktop /app/bin/ost-desktop
      - install -Dm755 target/release/teams-cli /app/bin/teams-cli
      - install -Dm644 desktop/packaging/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 desktop/packaging/${FLATPAK_ID}.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 desktop/packaging/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dm644 desktop/THIRD-PARTY-NOTICES.md /app/share/licenses/${FLATPAK_ID}/THIRD-PARTY-NOTICES.md
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - .claude
          - .git
          - backlog
      - cargo-sources.json

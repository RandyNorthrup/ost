<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  OST: Bluetooth headset call buttons on stock PipeWire (install-hfp-calls.sh
  installs this as /etc/dbus-1/system.d/ost-hfp-calls.conf, with @USER@
  replaced by the user's name).

  PipeWire's HFP audio gateway gives a headset's answer (ATA) and hang-up
  (AT+CHUP) to the calls of a modem at ModemManager's name on the system bus.
  This lets OST, run by @USER@, offer its calls there while the system's
  ModemManager doesn't run. OST shows its modem only to @USER@'s PipeWire
  (WirePlumber) and acts only on its calls.

  The sends below are the ones ModemManager's own policy allows everyone
  (PipeWire's gateway uses only these); they're repeated for systems without
  ModemManager installed.
-->
<busconfig>
  <policy user="@USER@">
    <allow own="org.freedesktop.ModemManager1"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.Voice"
           send_member="ListCalls"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Call"
           send_member="Accept"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Call"
           send_member="Hangup"/>
  </policy>
</busconfig>

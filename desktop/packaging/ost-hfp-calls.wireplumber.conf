# OST: Bluetooth headset call buttons on stock PipeWire. PipeWire's HFP audio
# gateway takes a headset's answer (ATA) and hang-up (AT+CHUP) to the calls of
# a modem at ModemManager's name on the system bus, where OST offers its calls
# (install-hfp-calls.sh). By default ("none") it doesn't look for one; "ost"
# takes only OST's (its Device property), never a real modem's.
# install-hfp-calls.sh installs this as
# ~/.config/wireplumber/wireplumber.conf.d/ost-hfp-calls.conf.
monitor.bluez.properties = {
  bluez5.hfphsp-backend-native-modem = "ost"
}

[package]
name = "ost-desktop"
version = "0.1.0"
edition = "2021"
description = "Native desktop client for Microsoft Teams, built on the OST engine"
license = "MIT"

[dependencies]
teams-cli = { path = "..", features = ["audio"] }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
# Desktop notifications (freedesktop D-Bus)
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cxx-qt-build = "0.10"
